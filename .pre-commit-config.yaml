# The committed examples under `docs/eval/` are bytes a digest pins. `record.json` carries the
# hash of its own quoted spans, and the loop example's baseline carries the hashes it compares
# against; a hook that appends a newline or trims whitespace changes those bytes and the example
# stops verifying, which is how the thing the examples exist to demonstrate gets quietly broken by
# a tidying pass. `pyproject.toml` excludes the same directory from the formatter for the same
# reason. Both exclusions are load-bearing.
exclude: ^docs/eval/(worked-example|loop-example)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.5
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
