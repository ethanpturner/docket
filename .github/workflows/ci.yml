name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv invocation asserts the lockfile is current instead of silently updating it.
env:
  UV_LOCKED: "1"

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        id: install
        run: uv sync --locked --all-groups

      # Each check runs even when an earlier one failed, so one run reports every problem.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy

      - name: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest -q
